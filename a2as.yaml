networks:
  arxiv.org:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://arxiv.org/abs/{p.get_short_id}
      caller: [_paper_to_dict]
  arxiv_link:
    type: api
    actions: [GET]
    protocols: [https]
    params:
      pattern: '[链接](https://arxiv.org/abs/{pid})'
      caller: [_format_sota_json_if_any]
      dynamic: "True"
      variable: arxiv_link
  html.duckduckgo.com:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://html.duckduckgo.com/html/?q={name}+dataset+OR+benchmark+OR+model
      caller: [_web_search_name_type]
  openapi.dp.tech:
    type: api
    actions: [POST, GET]
    urls: [/openapi/v1/api/integral/consume]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [deduct_photon, _fetch_search_result_content]
